name: Staging native images

"on":
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/staging-native-images.yml'
      - 'scripts/ci/**'
      - 'ornn-api/**'
      - 'ornn-web/**'
      - 'sdk/typescript/package.json'
      - 'package.json'
      - 'bun.lock'

permissions:
  contents: read

jobs:
  image:
    if: >-
      github.repository == 'ChronoAIProject/Ornn' &&
      ((github.ref == 'refs/heads/develop' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) ||
       (github.event_name == 'release' && github.event.action == 'published') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Release guards verify the tag commit is reachable from origin/main.
          fetch-depth: 0
      - name: Test staging provenance validation
        run: python3 -m unittest discover -s scripts/ci -p 'test_staging_*.py' -v
      - name: Install pinned image secret scanner
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/ornn-gitleaks"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$tool_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $tool_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$tool_dir/gitleaks.tar.gz" -C "$tool_dir" gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Test the vendored shared secret gate
        run: |
          bash scripts/ci/image-secret-scan/self-test.sh
          python3 scripts/ci/test_shared_image_gate.py -v
          TEST_SCANNER="$GITHUB_WORKSPACE/scripts/ci/image-secret-scan" \
            python3 -m unittest discover -s scripts/ci/content-policy/tests -v
      - name: Build, qualify and export on native amd64
        env:
          COMPONENT: ${{ matrix.component }}
        run: bash scripts/ci/staging-native-image.sh
      - name: Scan every saved image layer, config and history before publication
        # Keep time for evidence uploads even if the complete scan hits its limit.
        timeout-minutes: 45
        env:
          COMPONENT: ${{ matrix.component }}
        run: bash scripts/ci/staging-scan-image.sh
      - name: Retain redacted scan reports for review, including failures
        if: ${{ always() && hashFiles('staging-image-out/secret-scan-raw/REPORT.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: ornn-scan-${{ matrix.component }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            staging-image-out/secret-scan/REPORT.json
            staging-image-out/secret-scan/REPORT.txt
            staging-image-out/secret-scan/RESOLUTION.json
            staging-image-out/secret-scan/classifications.json
            staging-image-out/secret-scan-raw/REPORT.json
            staging-image-out/secret-scan-raw/REPORT.txt
            staging-image-out/scan-preflight.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain exact image and metadata
        if: ${{ always() && hashFiles('staging-image-out/metadata.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: ornn-native-${{ matrix.component }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-image-out/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: image
    if: >-
      github.repository == 'ChronoAIProject/Ornn' &&
      ((github.ref == 'refs/heads/develop' && github.event_name == 'push') ||
       (github.event_name == 'release' && github.event.action == 'published'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # One shared group per image across develop/release SHAs and workflow attempts.
    # External registry writers cannot participate in this Actions lock.
    concurrency:
      group: ornn-publish-${{ matrix.component }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Release guards verify the tag commit is reachable from origin/main.
          fetch-depth: 0
      - name: Select the successful native job's exact retained artifact
        id: artifact
        env:
          COMPONENT: ${{ matrix.component }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/staging_artifact.py
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact-id }}
          path: staging-image-out/
      - name: Install pinned digest-preserving image publisher
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/ornn-crane"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz \
            --output "$tool_dir/crane.tar.gz"
          echo "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0  $tool_dir/crane.tar.gz" | sha256sum --check --strict
          tar -xzf "$tool_dir/crane.tar.gz" -C "$tool_dir" crane
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Publish ornn-api or ornn-web and record immutable digests
        env:
          COMPONENT: ${{ matrix.component }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/ornn-ghcr
        run: bash scripts/ci/staging-publish-image.sh
      - name: Retain publication receipt
        uses: actions/upload-artifact@v6
        with:
          name: ornn-published-${{ matrix.component }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging-image-out/publication.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain artifact selection and publication execution
        uses: actions/upload-artifact@v6
        with:
          name: ornn-publication-execution-${{ matrix.component }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            staging-artifact.json
            staging-image-out/publication-action.json
            staging-image-out/registry-observation.json
          if-no-files-found: error
          retention-days: 7
      - name: Emit image publication handoff
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/develop'
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE_HANDOFF_ENABLED: ${{ vars.IMAGE_HANDOFF_ENABLED }}
          IMAGE_HANDOFF_WEB_ENABLED: ${{ vars.IMAGE_HANDOFF_WEB_ENABLED }}
          IMAGE_HANDOFF_REPOSITORY: ${{ secrets.IMAGE_HANDOFF_REPOSITORY }}
          IMAGE_HANDOFF_TOKEN: ${{ secrets.IMAGE_HANDOFF_TOKEN }}
        run: python3 scripts/ci/staging_handoff.py
