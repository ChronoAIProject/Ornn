[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ornn-sdk"
version = "0.2.0"
description = "Python client for Ornn — the end-to-end skill life-cycle manager for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chrono AI" }]
keywords = [
    "ornn",
    "agent",
    "skill-registry",
    "skill-lifecycle",
    "ai-agents",
    "model-agnostic",
    "mcp",
    "llm",
    "sdk",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    # Upper bound (#445) — keep us inside the 0.x line until we
    # actively vet a 1.x bump. Unbounded would let a future major
    # release land in CI silently.
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    # pytest 9.0.3+ closes CVE-2025-71176; widen the bound so 10.x
    # still pins us inside a tested major.
    "pytest>=9.0.3,<10",
    "respx>=0.21,<1.0",
    "pytest-asyncio>=0.23,<2.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # Coverage reporter — feeds Codecov on every PR (#471).
    "pytest-cov>=5",
]

[project.urls]
Homepage = "https://github.com/ChronoAIProject/Ornn"
Issues = "https://github.com/ChronoAIProject/Ornn/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ornn_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# ──────────────── ruff (#583) ────────────────
# Lint + format the SDK. Default ruleset (E, W, F) + isort (I) + a few
# refinements that catch the bugs we'd actually see in a thin HTTP
# client: pyflakes is the floor, bugbear catches misuse, pyupgrade
# keeps us on modern Python.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    # pytest fixtures legitimately use names that shadow outer scope.
    "F811",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    # Test fixtures shadow names freely; allowed.
    "F811",
    # Tests use long mock data strings.
    "E501",
]

# ──────────────── mypy (#583) ────────────────
# Strict-ish gate on the SDK surface; the public client is the one
# place we cannot let type drift go unobserved. Tests run in a looser
# config because respx fixtures are dynamically typed.
[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
# `Any` from upstream (httpx, respx) is expected at the boundary;
# our internal code stays strict.
disallow_any_unimported = false
warn_unused_ignores = true
show_error_codes = true
# httpx ships its own inline types; older typeshed stubs may not
# expose every method. Permit the import without per-line ignores.
[[tool.mypy.overrides]]
module = "httpx.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
