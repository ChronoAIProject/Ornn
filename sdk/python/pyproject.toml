[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ornn-sdk"
version = "0.2.0"
description = "Python client for Ornn — the end-to-end skill life-cycle manager for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chrono AI" }]
keywords = [
    "ornn",
    "agent",
    "skill-registry",
    "skill-lifecycle",
    "ai-agents",
    "model-agnostic",
    "mcp",
    "llm",
    "sdk",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    # Upper bound (#445) — keep us inside the 0.x line until we
    # actively vet a 1.x bump. Unbounded would let a future major
    # release land in CI silently.
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "respx>=0.21,<1.0",
    "pytest-asyncio>=0.23,<1.0",
]

[project.urls]
Homepage = "https://github.com/ChronoAIProject/Ornn"
Issues = "https://github.com/ChronoAIProject/Ornn/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ornn_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
