apiVersion: v1
kind: ConfigMap
metadata:
  name: ornn-api-config
  namespace: ${NAMESPACE}
data:
  PORT: "${ORNN_API_PORT}"
  LOG_LEVEL: "${ORNN_API_LOG_LEVEL}"
  LOG_PRETTY: "${ORNN_API_LOG_PRETTY}"
  NYXID_SA_TOKEN_URL: "${NYXID_SA_TOKEN_URL}"
  NYX_LLM_GATEWAY_URL: "${NYX_LLM_GATEWAY_URL}"
  MONGODB_DB: "${MONGODB_DB}"
  STORAGE_SERVICE_URL: "${STORAGE_SERVICE_URL}"
  STORAGE_BUCKET: "${STORAGE_BUCKET}"
  SANDBOX_SERVICE_URL: "${SANDBOX_SERVICE_URL}"
  DEFAULT_LLM_MODEL: "${DEFAULT_LLM_MODEL}"
  LLM_MAX_OUTPUT_TOKENS: "${LLM_MAX_OUTPUT_TOKENS}"
  LLM_TEMPERATURE: "${LLM_TEMPERATURE}"
  SSE_KEEP_ALIVE_INTERVAL_MS: "${SSE_KEEP_ALIVE_INTERVAL_MS}"
  MAX_PACKAGE_SIZE_BYTES: "${MAX_PACKAGE_SIZE_BYTES}"
  ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}"
  EXTRA_NYXID_SERVICES: "${EXTRA_NYXID_SERVICES}"
  # PostHog (non-secret config — host + sample rate). API key + project
  # id live in secret.yaml so they don't end up in `kubectl describe`.
  POSTHOG_HOST: "${POSTHOG_HOST}"
  POSTHOG_ERROR_SAMPLE_RATE: "${POSTHOG_ERROR_SAMPLE_RATE}"
  # AgentSeal scanner (#253). Binary baked into the image; this just
  # controls the runtime kill-switch and the per-scan timeout.
  AGENTSEAL_ENABLED: "${AGENTSEAL_ENABLED}"
  AGENTSEAL_TIMEOUT_MS: "${AGENTSEAL_TIMEOUT_MS}"
  GITHUB_MIRROR_ENABLED: "${GITHUB_MIRROR_ENABLED}"
  GITHUB_MIRROR_REPO_OWNER: "${GITHUB_MIRROR_REPO_OWNER}"
  GITHUB_MIRROR_REPO_NAME: "${GITHUB_MIRROR_REPO_NAME}"
  GITHUB_MIRROR_DEFAULT_BRANCH: "${GITHUB_MIRROR_DEFAULT_BRANCH}"
  ORNN_PUBLIC_ORIGIN: "${ORNN_PUBLIC_ORIGIN}"
