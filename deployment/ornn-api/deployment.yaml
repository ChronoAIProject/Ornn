apiVersion: apps/v1
kind: Deployment
metadata:
  name: ornn-api
  namespace: ${NAMESPACE}
  labels:
    app: ornn-api
spec:
  # Pinned to 1: the in-process rate limiter (ornn-api/src/middleware/rateLimit.ts) keeps per-pod buckets.
  # Do NOT raise >1 or add an HPA without a shared-store backend first (#837) — per-pod buckets multiply the effective limit by replica count.
  replicas: 1
  selector:
    matchLabels:
      app: ornn-api
  template:
    metadata:
      labels:
        app: ornn-api
    spec:
      # Audit path downloads skill zips via presigned URLs signed by
      # chrono-storage. Those URLs use `minio.ornn-cluster.local` (the
      # browser-facing hostname) so signatures match whoever GETs them.
      # Resolve that hostname in-cluster so ornn-api can also fetch.
      hostAliases:
        - ip: ${MINIO_HOST_ALIAS_IP}
          hostnames:
            - minio.ornn-cluster.local
      containers:
        - name: ornn-api
          image: ${ORNN_API_IMAGE}
          imagePullPolicy: ${IMAGE_PULL_POLICY}
          ports:
            - containerPort: 3802
          # Operator-flippable settings (kill switches, repo coords,
          # credentials, model + provider config, storage + sandbox
          # endpoints) live in the platform_settings DB collection and
          # are managed via the admin UI — see #268, #269, #270, #271.
          # The Secret carries the six bootstrap-only secrets. Every
          # entry below is plain operational env consumed by code
          # (cross-checked against config.ts + infra/url.ts) — no
          # vestigial keys.
          env:
            - name: PORT
              value: "${PORT}"
            - name: LOG_LEVEL
              value: "${LOG_LEVEL}"
            - name: LOG_PRETTY
              value: "${LOG_PRETTY}"
            - name: MONGODB_DB
              value: "${MONGODB_DB}"
            - name: MAX_PACKAGE_SIZE_BYTES
              value: "${MAX_PACKAGE_SIZE_BYTES}"
            - name: ALLOWED_ORIGINS
              value: "${ALLOWED_ORIGINS}"
            - name: ORNN_PUBLIC_ORIGIN
              value: "${ORNN_PUBLIC_ORIGIN}"
            - name: ORNN_URL_ALLOWLIST_CIDR
              value: "${ORNN_URL_ALLOWLIST_CIDR}"
            - name: ORNN_TRUSTED_PROXY_HOPS
              value: "${ORNN_TRUSTED_PROXY_HOPS}"
            - name: AGENTSEAL_PYTHON
              value: "${AGENTSEAL_PYTHON}"
            - name: AGENTSEAL_SCRIPT
              value: "${AGENTSEAL_SCRIPT}"
          envFrom:
            - secretRef:
                name: ornn-api-secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3802
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: 3802
            initialDelaySeconds: 20
            periodSeconds: 10
