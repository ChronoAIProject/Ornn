apiVersion: v1
kind: Secret
metadata:
  name: ornn-api-secret
  namespace: ${NAMESPACE}
type: Opaque
# Bootstrap secrets only — every operator-flippable setting (LLM
# provider override, GitHub mirror kill switch + repo coords + App
# credentials, etc.) lives in the `platform_settings` Mongo collection
# and is managed via the admin UI. Sensitive fields there are encrypted
# at rest with `ENCRYPTION_KEY`.
stringData:
  NYXID_SA_CLIENT_ID: "${NYXID_SA_CLIENT_ID}"
  NYXID_SA_CLIENT_SECRET: "${NYXID_SA_CLIENT_SECRET}"
  MONGODB_URI: "${MONGODB_URI}"
  # PostHog product analytics. Empty string disables the SDK and falls
  # back to the noop tracker.
  POSTHOG_API_KEY: "${POSTHOG_API_KEY}"
  POSTHOG_PROJECT_ID: "${POSTHOG_PROJECT_ID}"
  # Master passphrase for AES-256-GCM at-rest encryption of admin-pasted
  # secrets (LLM provider apiKey, GitHub App private key). Cluster-scoped:
  # rotating this makes every previously-encrypted secret unreadable, so
  # pick once per deployment and treat it as load-bearing. Generate with:
  #   openssl rand -hex 32
  ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
