apiVersion: v1
kind: Secret
metadata:
  name: ornn-api-secret
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  NYXID_SA_CLIENT_ID: "${NYXID_SA_CLIENT_ID}"
  NYXID_SA_CLIENT_SECRET: "${NYXID_SA_CLIENT_SECRET}"
  MONGODB_URI: "${MONGODB_URI}"
  # GitHub mirror — present only when GITHUB_MIRROR_ENABLED=true.
  # PRIVATE_KEY is the App's PEM, multi-line. envsubst preserves
  # newlines fine; if pasting into a single-line env var, replace
  # newlines with literal `\n` and ornn-api expands them at boot.
  GITHUB_APP_ID: "${GITHUB_APP_ID}"
  GITHUB_APP_PRIVATE_KEY: "${GITHUB_APP_PRIVATE_KEY}"
  GITHUB_APP_INSTALLATION_ID: "${GITHUB_APP_INSTALLATION_ID}"
